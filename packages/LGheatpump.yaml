###############################################################################
# COP from calculated temperatures
###############################################################################

  - platform: template
    name: "HP Estimated COP"
    id: heatpump_estimated_cop
    unit_of_measurement: "W/W"
    device_class: ""
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

    lambda: |-

      float t_cond = id(hp_condensing_temp).state;
      float t_evap = id(hp_evaporating_temp).state;

      if (isnan(t_cond) || isnan(t_evap))
        return NAN;

      if ((t_cond - t_evap) < 1.0f)
        return NAN;


      float lift = t_cond - t_evap;

      const float lift_tbl[] = {
        20, 25, 30, 40, 50, 60, 70
      };

      const float eta_tbl[] = {
        0.39, 0.44, 0.45, 0.45, 0.40, 0.35, 0.30
      };

      float eta = lookup(
          lift,
          lift_tbl,
          eta_tbl,
          sizeof(lift_tbl) / sizeof(lift_tbl[0]));

      float cop =
        eta *
        ((t_cond + 273.15f) /
         (t_cond - t_evap));

      if (cop < 1.0f)
        cop = 1.0f;

      if (cop > 10.0f)
        cop = 10.0f;

      return cop;

###############################################################################
# Superheat
###############################################################################

  - platform: template
    name: "Heat Pump Superheat"
    id: heatpump_superheat
    unit_of_measurement: "K"
    accuracy_decimals: 1
    update_interval: never
    device_class: ""
    state_class: measurement

    lambda: |-

      float tevap = id(hp_evaporating_temp).state;
      float suction = id(temp18).state;

      if (isnan(tevap) || isnan(suction))
        return NAN;

      return suction - tevap;
