esphome:
  name: "${device_name}"
  on_boot:
    priority: 200
    then:
      lambda: !lambda |-
          C = new Customize();
          //Set initial states

  includes:
    - ../customize/custom.h
    - ../customize/custom_${customize}.h
    - ../customize/lookup.h


esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

