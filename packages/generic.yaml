switch:
  - platform: restart
    name: "LG Therma ESPHome Restart"
  - platform: template
    name: "WP Heat"
    id: thermostat_wp_heat
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
  - platform: template
    name: "Force run end"
    id: force_run_end
    restore_mode: ALWAYS_OFF
    optimistic: true


interval:
  - interval: 20s
    id: state_machine
    then: !include state_machine.c
  - interval: 60s
    then:
      - lambda: |-
          if (id(thermostat_timer)>0) {
            id(thermostat_timer)--;
            id(thermostaat).execute();
          }  

    
sensor:


  - platform: template
    name: "Stooklijn Watertemp Target"
    id: watertemp_target
    unit_of_measurement: "°C"
    update_interval: 60s
    #lambda: |-
    #    //return id(stooklijn_target);

  - platform: template
    name: "Huiskamer lucht"
    id: huiskamer_lucht
    unit_of_measurement: "°C"
    update_interval: 1s
    lambda: |-
      if (id(api_id).is_connected())
        return id(huiskamer_lucht_hass).state;
      else
        return id(binnen_temp).state;

  - platform: template
    name: "Thermostat error"
    id: thermostat_error
    unit_of_measurement: "°C"
    update_interval: 5s
    lambda: |-
        return (id(huiskamer_thermostaat_target).state - id(huiskamer_lucht).state); // e = ref - measured
    filters:
      - sliding_window_moving_average:
          window_size: 120
          send_every: 1
    on_value:
      then:
        script.execute: thermostaat


  - platform: template
    name: "Temp20 filtered"
    id: temp20_filtered
    unit_of_measurement: "°C"
    update_interval: 20s
    lambda: |-
        return (id(temp20).state);
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 1
  - platform: template
    name: "Temp18 filtered"
    id: temp18_filtered
    unit_of_measurement: "°C"
    update_interval: 20s
    lambda: |-
        return (id(temp18).state);
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 1

  - platform: template
    name: "Heatpump Water power"
    id: water_power
    unit_of_measurement: "W"
    state_class: measurement
    device_class: power
    accuracy_decimals: 0
    update_interval: 5s
    lambda: |-
        return (id(hp_temp_out).state - id(hp_temp_in).state) * id(current_flow_rate).state / 60.0 * 4168.0 * ((id(operation_mode).current_option() == "Cooling") ? -1.0 : 1.0);

  - platform: template
    name: "Heatpump COP"
    id: hp_cop
    unit_of_measurement: "W/W"
    accuracy_decimals: 2
    update_interval: 20s
    state_class: measurement
    lambda: |-
        return (id(water_power).state/id(lg_total_active_power).state);

  - platform: template
    name: "Target Power effective"
    id: power_target_effective
    unit_of_measurement: "W"
    accuracy_decimals: 0
    update_interval: 20s
    lambda: |-
        // drop the power target when Home Assistant is gone for 10 minutes, the normal thermostat takes over
        static uint32_t last_connected = millis();
        if (id(api_id).is_connected())
          last_connected = millis();
        if (isnan(id(wp_target_power).state) || ((millis() - last_connected) > 10*60*1000UL))
          return 0.0;
        return id(wp_target_power).state;

  - platform: template
    name: "Water dT corrected"
    id: water_dt_corrected
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: 20s
    lambda: |-
        // LG outlet - return, corrected for the return sensor bias
        return (id(water_temp_aanvoer).state - id(water_temp_retour).state + id(water_dt_offset).state);
    filters:
      - sliding_window_moving_average:
          window_size: 9
          send_every: 1

  - platform: template
    name: "Floor heat exchanger efficiency"
    id: floor_eps
    accuracy_decimals: 3
    update_interval: 20s
    lambda: |-
        // eps = 1 - exp(-UA / (m * cp)), share of (outlet - floor) the water gives off in the floor loop
        const float mcp = id(current_flow_rate).state / 60.0 * 4168.0; // W/K
        if (isnan(mcp) || (mcp < 300.0))
          return NAN;
        return 1.0 - expf(-id(floor_ua).state / mcp);

  - platform: template
    name: "Estimated floor temperature"
    id: floor_temp_est
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 20s
    lambda: |-
        // To - dT / eps, only meaningful while the compressor is heating
        if (!id(compressor_running).state || id(defrosting).state || isnan(id(floor_eps).state) || !(id(water_dt_corrected).state > 0.5))
          return NAN;
        return id(water_temp_aanvoer).state - id(water_dt_corrected).state / id(floor_eps).state;

  - platform: template
    internal: True 
    id: lg_total_active_power_filtered
    unit_of_measurement: "W"
    accuracy_decimals: 2
    update_interval: 5s
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 1
    state_class: measurement
    lambda: |-
        return (id(lg_total_active_power).state);

  - platform: wifi_signal
    name: "${device_name} WiFi Signal"
    update_interval: 120s
    accuracy_decimals: 0
  - platform: uptime
    name: "${device_name} Uptime"
    unit_of_measurement: days
    update_interval: 3600s
    accuracy_decimals: 1
    filters:
      - multiply: 0.000011574

