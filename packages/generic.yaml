globals:
  - id: stooklijn_target
    type: float
    restore_value: no
    initial_value: '27'
  - id: thermostat_timer
    type: int
    restore_value: no
    initial_value: "0"

script:
  - id: update_stooklijn_target
    then: 
      - delay: 1s #I get the impression we need this delay to make sure the id(...).state will return the new data...
      - lambda: !lambda |-
          float oat = id(buiten_temp).state;
          //Heating
          //Formula is wTemp = -Z x (OAT-stooklijn_start_temp) + stooklijn_min_wtemp
          //Formula to calculate -Z = ((stooklijn_max_wtemp-stooklijn_min_wtemp)) / (stooklijn_min_oat - stooklijn_start_temp))
          const float minZ = ((float)id(stooklijn_max_wtemp).state-(float)id(stooklijn_min_wtemp).state)/( (float)id(stooklijn_min_oat).state - (float)id(stooklijn_start_temp).state);
          ESP_LOGD("stooklijn", "Stooklijn, working mode is heating, with oat: %f, minZ: %f",oat, minZ);

          oat = clamp(oat, id(stooklijn_min_oat).state, id(stooklijn_start_temp).state);

          id(stooklijn_target) = round(((minZ * (oat-id(stooklijn_start_temp).state))+id(stooklijn_min_wtemp).state)*10)/10.0;

          //Add stooklijn offset
          id(stooklijn_target) = id(stooklijn_target) + id(wp_stooklijn_offset).state;

          //Make sure target is not above max water or below minimum temp
          id(stooklijn_target) = clamp(id(stooklijn_target), id(stooklijn_min_wtemp).state, id(stooklijn_max_wtemp).state);

          ESP_LOGD("stooklijn", "New stooklijn target value (after correction): %f", id(stooklijn_target));
          //Publish new stooklijn value to watertemp value sensor
          //id(watertemp_target).publish_state(id(stooklijn_target));
  - id: thermostaat
    mode: restart
    then: 
      - delay: 1s
      - lambda: !lambda |-
          static bool switched = false;
          static bool is_power_target = false;
          ESP_LOGD("Thermostaat", "T: %f, %f, ref: %f", id(huiskamer_lucht).state, (id(huiskamer_lucht).state-id(huiskamer_thermostaat_target).state), id(thermostat_wp_heat).state?0.5:0.0);
          ESP_LOGD("Thermostaat", "switched: %s, timer: %d", switched?"True":"False", id(thermostat_timer));
          
          if (id(power_target_effective).state > 0.05) {
            is_power_target = true;
            if (!(id(thermostat_wp_heat).state)) {
              ESP_LOGD("Thermostaat", "Target power set, turn on the thermostaat");
              id(thermostat_wp_heat).turn_on();
              switched = false;
            }
          } else { // wp_target_power is 0
            if (is_power_target) {
              id(thermostat_wp_heat).turn_off();
            } else {
              if ((id(huiskamer_lucht).state-id(huiskamer_thermostaat_target).state) <= (id(thermostat_wp_heat).state?0.5:0.0)) {
                ESP_LOGD("Thermostaat", "Thermostaat aan");
                if (!(id(thermostat_wp_heat).state)) {
                  if (!switched) {
                    switched = true;
                    id(thermostat_timer) = 15; // minimum time thermostat heat ask before heat ask turned on?
                  }
                  if (id(thermostat_timer)==0) {
                    id(thermostat_wp_heat).turn_on();
                  }
                } else switched = false;
              } else {
                if (id(stooklijn_target) >= 26.0) { // ugly hack moved out of the state_machine
                  ESP_LOGD("Thermostaat", "Thermostaat aan gelaten");
                } else {
                  ESP_LOGD("Thermostaat", "Thermostaat uit");
                  if ((id(thermostat_wp_heat).state)) {
                    if (!switched) {
                      switched = true;
                      id(thermostat_timer) = 15; // minimum time thermostat stop-heat ask before heat ask turned on?
                    }

                    if (id(thermostat_timer)==0) {
                      id(thermostat_wp_heat).turn_off();
                    }
                  } else switched = false;
                }
              }
            }
            // wp_target_power is 0
            is_power_target = false;
          }

text_sensor:
  - platform: template
    name: "LG Controller state"
    id: lg_controller_state
    update_interval: never
  - platform: template
    name: "LG MPA Controller state"
    id: lg_mpa_controller_state
    update_interval: never
  - platform: template
    name: "Power target state"
    id: power_target_state
    update_interval: never

number:
  - platform: template
    mode: box
    name: "Stooklijn offset"
    id: wp_stooklijn_offset
    min_value: -5
    max_value: 5
    initial_value: 0
    step: 1
    restore_value: yes
    unit_of_measurement: "°C"
    optimistic: true
    set_action:
      then:
        - script.execute: update_stooklijn_target
  - platform: template
    mode: box
    name: "Thermostaat target"
    id: huiskamer_thermostaat_target
    min_value: 10
    max_value: 25
    initial_value: ${thermostat_initial_value} #19.0
    step: ${thermostat_step_size} #1
    restore_value: yes
    unit_of_measurement: "°C"
    optimistic: true
    set_action:
      then:
        script.execute: thermostaat
  - platform: template
    mode: box
    name: "Thermostat error gain"
    id: thermostat_error_gain
    min_value: 0
    max_value: 20
    initial_value: 10
    step: 1
    restore_value: yes
    unit_of_measurement: "°C/°C"
    optimistic: true
  - platform: template
    mode: box
    id: stooklijn_min_oat
    name: "Stooklijn Minimum Buitentemperatuur"
    min_value: -25
    max_value: 0
    step: 1
    restore_value: yes
    initial_value: -15
    unit_of_measurement: "°C"
    optimistic: true
    set_action:
      then:
        - script.execute: update_stooklijn_target
  - platform: template
    mode: box
    id: stooklijn_max_wtemp
    name: "Stooklijn Maximum Watertemperatuur"
    min_value: 20
    max_value: ${max_wtemp_custom} #was 60
    step: 1
    restore_value: yes
    initial_value: 35
    unit_of_measurement: "°C"
    optimistic: true
    set_action:
      then:
        - script.execute: update_stooklijn_target
  - platform: template
    mode: box
    id: stooklijn_min_wtemp
    name: "Stooklijn Minimum Watertemperatuur"
    min_value: 20
    max_value: 35
    step: 1
    restore_value: yes
    initial_value: 22
    unit_of_measurement: "°C"
    optimistic: true
    set_action:
      then:
        - script.execute: update_stooklijn_target
  - platform: template
    mode: box
    id: stooklijn_start_temp
    name: "Stooklijn Start Buitentemperatuur"
    min_value: 0
    max_value: 20
    step: 1
    restore_value: yes
    initial_value: 15
    unit_of_measurement: "°C"
    optimistic: true
    set_action:
      then:
        - script.execute: update_stooklijn_target
  - platform: template
    mode: box
    id: minimum_run_time
    name: "Minimale run tijd"
    min_value: 0
    max_value: 120
    step: 1
    restore_value: yes
    initial_value: 30
    unit_of_measurement: "min"
    optimistic: true
  - platform: template
    mode: box
    id: minimum_off_time
    name: "Minimale after-run tijd"
    min_value: 0
    max_value: 30
    step: 1
    restore_value: yes
    initial_value: 15
    unit_of_measurement: "min"
    optimistic: true
  - platform: template
    mode: box
    id: floor_ua
    name: "Power target floor UA"
    min_value: 200
    max_value: 10000
    step: 50
    restore_value: yes
    initial_value: ${floor_ua_initial}
    unit_of_measurement: "W/K"
    optimistic: true
  - platform: template
    mode: box
    id: water_dt_offset
    name: "Water dT offset"
    min_value: -2
    max_value: 2
    step: 0.01
    restore_value: yes
    initial_value: 0.39
    unit_of_measurement: "°C"
    optimistic: true
  - platform: template
    mode: box
    id: power_target_deadband
    name: "Power target deadband"
    min_value: 100
    max_value: 1000
    step: 50
    restore_value: yes
    initial_value: 300
    unit_of_measurement: "W"
    optimistic: true
  - platform: template
    mode: box
    id: power_target_max_wtemp
    name: "Power target maximum watertemperatuur"
    min_value: 25
    max_value: ${max_wtemp_custom}
    step: 1
    restore_value: yes
    initial_value: 40
    unit_of_measurement: "°C"
    optimistic: true
  - platform: template
    mode: box
    id: power_target_silent_limit
    name: "Power target silent mode limit"
    min_value: 0
    max_value: 10000
    step: 100
    restore_value: yes
    initial_value: 2000
    unit_of_measurement: "W"
    optimistic: true
